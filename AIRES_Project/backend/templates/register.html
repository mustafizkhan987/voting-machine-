<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Election Voting System - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header-gov">Government of India - Election Commission</div>
    <div class="container">
        <header>
            <h1>Register for Voting</h1>
            <nav>
                <a href="{{ url_for('login') }}">Login</a>
            </nav>
        </header>
        <main>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </main>
    </div>
    <div class="footer-gov">© 2025 Election Commission of India. All rights reserved.</div>
</body>
</html>
